<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Obfuscator</title>
  <script src="https://cdn.jsdelivr.net/npm/javascript-obfuscator/dist/index.browser.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --bg-color: #f9f9f9;
      --text-color: #1a1a1a;
      --textarea-bg: #ffffff;
      --border-color: #d1d5db;
      --button-bg: #1f2937;
      --button-hover: #111827;
      --tag-bg: #e5e7eb;
      --tag-text: #374151;
      --input-bg: #ffffff;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --textarea-bg: #1e1e1e;
      --border-color: #888;
      --button-bg: #2c2c2c;
      --button-hover: #444;
      --tag-bg: #2a2a2a;
      --tag-text: #ccc;
      --input-bg: #1e1e1e;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
      max-width: 700px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .tag {
      font-size: 13px;
      background-color: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 20px;
      padding: 4px 12px;
      margin-left: 8px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    select, textarea, button, input[type="color"] {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--textarea-bg);
      color: var(--text-color);
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 150px;
    }

    button {
      margin-top: 10px;
      background-color: var(--button-bg);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--button-hover);
    }

    #errorMsg {
      color: #dc2626;
      margin-top: 10px;
      display: none;
    }

    #themeToggle {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background-color: var(--button-bg);
      color: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
      z-index: 1000;
      user-select: none;
      border: 1px solid var(--border-color);
    }

    #customizer {
      position: fixed;
      right: 20px;
      bottom: 80px;
      background-color: var(--button-bg);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      z-index: 1000;
      width: 180px;
      box-shadow: 0 0 8px rgba(0,0,0,0.15);
      font-size: 14px;
    }

    #customizer label {
      display: block;
      margin-bottom: 4px;
      margin-top: 8px;
      font-weight: normal;
    }

    #customizer input[type="color"] {
      width: 100%;
      height: 36px;
      border: none;
      margin-bottom: 8px;
      padding: 0;
    }
  </style>
</head>
<body>
  <h1>
    Code Obfuscator <span class="tag">Made with GitHub and Netlify</span>
  </h1>

  <div id="errorMsg" role="alert"></div>

  <label for="modeSelect">Select Mode:</label>
  <select id="modeSelect">
    <option value="js">JavaScript</option>
    <option value="html">HTML</option>
    <option value="css">CSS</option>
    <option value="python">Python</option>
    <option value="c">C</option>
    <option value="cpp">C++</option>
    <option value="csharp">C#</option>
    <option value="perl">Perl</option>
    <option value="haskell">Haskell</option>
  </select>

  <label for="inputCode">Original Code:</label>
  <textarea id="inputCode" aria-label="Original Code" placeholder="Paste your code here..."></textarea>

  <button onclick="obfuscateCode()">Obfuscate</button>
  <button onclick="copyObfuscatedCode()">Copy</button>

  <label for="outputCode">Obfuscated Code:</label>
  <textarea id="outputCode" aria-label="Obfuscated Code" readonly placeholder="Obfuscated code will appear here..."></textarea>

  <!-- Customizer UI -->
  <div id="customizer">
    <label for="borderColorPicker">Border Color:</label>
    <input type="color" id="borderColorPicker" />

    <label for="textColorPicker">Input Text Color:</label>
    <input type="color" id="textColorPicker" />
  </div>

  <!-- Theme toggle -->
  <div id="themeToggle" onclick="toggleTheme()">Toggle Theme</div>

  <!-- External script -->
  <script src="script.js"></script>
</body>
</html>
